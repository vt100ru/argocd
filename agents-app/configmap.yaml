apiVersion: v1
kind: ConfigMap
metadata:
  name: agents-app-code
  namespace: agents-dev
  labels:
    app: agents-app
data:
  main.py: |
    import datetime
    import os
    import platform
    import socket

    from fastapi import FastAPI
    from fastapi.responses import HTMLResponse

    app = FastAPI(title="Agents App Demo")

    request_count = 0

    HTML = """<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>K8s Pod Dashboard</title>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: 'Segoe UI', system-ui, sans-serif;
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 1rem;
        }
        .card {
          background: rgba(255,255,255,0.05);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 20px;
          padding: 2.5rem;
          width: 100%;
          max-width: 680px;
          backdrop-filter: blur(10px);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { color: #e2e8f0; font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
        .badge-row { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
        .badge {
          padding: 0.2rem 0.7rem;
          border-radius: 20px;
          font-size: 0.7rem;
          font-weight: 600;
          letter-spacing: 0.05em;
        }
        .badge-ai  { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .badge-live { background: rgba(72,187,120,0.2); color: #68d391; border: 1px solid #68d391; }
        .grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 1rem;
          margin-bottom: 1.5rem;
        }
        .cell {
          background: rgba(255,255,255,0.04);
          border: 1px solid rgba(255,255,255,0.08);
          border-radius: 12px;
          padding: 1rem;
        }
        .cell-label {
          font-size: 0.65rem;
          text-transform: uppercase;
          letter-spacing: 0.12em;
          color: #718096;
          margin-bottom: 0.4rem;
        }
        .cell-value {
          font-size: 0.95rem;
          font-weight: 600;
          color: #e2e8f0;
          word-break: break-all;
        }
        .cell-value.accent { color: #90cdf4; }
        .cell-value.green  { color: #68d391; }
        .footer {
          text-align: center;
          font-size: 0.72rem;
          color: #4a5568;
        }
        .dot {
          display: inline-block;
          width: 7px; height: 7px;
          border-radius: 50%;
          background: #68d391;
          margin-right: 0.3rem;
          animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="header">
          <h1>Kubernetes Pod Dashboard</h1>
          <div class="badge-row">
            <span class="badge badge-ai">&#x1F916; Generated by AI Agents</span>
            <span class="badge badge-live"><span class="dot"></span>Live</span>
          </div>
        </div>

        <div class="grid" id="grid">
          <div class="cell"><div class="cell-label">Status</div>
            <div class="cell-value">Connecting...</div></div>
        </div>

        <div class="footer">
          Auto-refreshes every 2s &nbsp;·&nbsp; FastAPI &nbsp;·&nbsp; Deployed via ArgoCD
        </div>
      </div>

      <script>
        async function refresh() {
          try {
            const d = await fetch('/api/info').then(r => r.json());
            document.getElementById('grid').innerHTML = `
              <div class="cell">
                <div class="cell-label">Pod Hostname</div>
                <div class="cell-value accent">${d.hostname}</div>
              </div>
              <div class="cell">
                <div class="cell-label">Timestamp</div>
                <div class="cell-value">${d.timestamp}</div>
              </div>
              <div class="cell">
                <div class="cell-label">Requests (this pod)</div>
                <div class="cell-value green">${d.request_count}</div>
              </div>
              <div class="cell">
                <div class="cell-label">Python Version</div>
                <div class="cell-value">${d.python_version}</div>
              </div>
              <div class="cell">
                <div class="cell-label">Namespace</div>
                <div class="cell-value">${d.namespace}</div>
              </div>
              <div class="cell">
                <div class="cell-label">Node</div>
                <div class="cell-value">${d.node_name}</div>
              </div>
            `;
          } catch (e) {
            console.error(e);
          }
        }
        refresh();
        setInterval(refresh, 2000);
      </script>
    </body>
    </html>
    """


    @app.get("/", response_class=HTMLResponse)
    def root():
        return HTML


    @app.get("/api/info")
    def info():
        global request_count
        request_count += 1
        return {
            "hostname": socket.gethostname(),
            "timestamp": datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
            "request_count": request_count,
            "python_version": platform.python_version(),
            "namespace": os.environ.get("POD_NAMESPACE", "unknown"),
            "node_name": os.environ.get("NODE_NAME", "unknown"),
        }


    @app.get("/api/health")
    def health():
        return {"status": "healthy"}

  requirements.txt: |
    fastapi>=0.115.0
    uvicorn[standard]>=0.34.0

