apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agents-app-ingress
  namespace: agents-dev
  labels:
    app: agents-app
  annotations:
    # Regex capture group $2 strips the /argo/agents prefix so FastAPI
    # receives requests at their actual paths (/api/info, /, etc.)
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: cluster
      http:
        paths:
          - path: /argo/agents(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agents-app-service
                port:
                  number: 8000
